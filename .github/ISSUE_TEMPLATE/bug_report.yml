name: Bug report
description: Something in Bomb Flower is wrong, crashes, or writes a save the game mishandles.
title: "[Bug]: "
body:
  - type: markdown
    id: intro
    attributes:
      value: |
        **Do not attach a personal save or any other game data.**

        A save-editor bug can destroy the only copy of a save. Work on a copy,
        keep the original where the game wrote it, and describe the file instead
        of uploading it. `progress.sav`, `caption.sav`, ROMs and dumps are
        untracked game data in this repository and out of scope for an issue
        attachment.

  - type: input
    id: app-version
    attributes:
      label: App version or commit SHA
      description: The version string in the app, or the commit you built from (`git rev-parse --short HEAD`). Do not write "latest".
      placeholder: e.g. 0.1.0 or f4e0499
    validations:
      required: true

  - type: dropdown
    id: build-channel
    attributes:
      label: How was this build obtained?
      description: Pick the closest match. A release binary and a local debug build fail in different places.
      options:
        - Release build (downloaded asset)
        - Local `flutter build linux --debug`
        - Local `flutter build linux --release`
        - "`flutter run -d linux`"
        - Other (described below)
    validations:
      required: true

  - type: textarea
    id: os-and-session
    attributes:
      label: OS and session type
      description: Distro and version, X11 or Wayland, and whether this is a real compositor or a headless server such as Xvfb. Window-manager and GTK version help too.
      placeholder: |
        e.g. Arch Linux rolling, Wayland under sway 0.10, GTK 3.24.44
        e.g. Debian 13, X11 under Xvfb (xvfb-run), GTK 3.24.49
    validations:
      required: true

  - type: textarea
    id: reproduction-steps
    attributes:
      label: Exact reproduction steps
      description: Numbered steps from a known starting state. Say whether a save folder was loaded, which slot, and what you clicked. If the bug needs a specific file, describe its shape instead of attaching it.
      placeholder: |
        1. Launch with `flutter run -d linux`
        2. Open `<dir>/slot_00/`
        3. ...
        4. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected-vs-actual
    attributes:
      label: Expected vs actual
      description: What you expected to happen, and what happened instead. Include the exact dialog text, exception, or log line if there is one.
    validations:
      required: true

  - type: markdown
    id: save-evidence-warning
    attributes:
      value: |
        ### Save-related bugs: describe the file, do not upload it

        Never attach a personal save unredacted. Attach the **smallest synthetic
        or scrubbed sample** instead, and state that it was redacted and how.
        If you cannot produce a safe sample, the description below is enough for
        triage — most save-format bugs are diagnosable from sizes, offsets and
        field names alone.

  - type: textarea
    id: format-evidence
    attributes:
      label: Save evidence (save-related bugs only)
      description: >-
        Leave blank for non-save bugs. Otherwise: the `progress.sav` and
        `caption.sav` byte sizes, whether the game or the app produced the file,
        the affected slot folder (`slot_NN`), the field name or the record hash,
        and the byte offset if you know it. State clearly if any attached sample
        was redacted, and how.
      placeholder: |
        progress.sav: 120572 bytes, produced by the game, slot_00
        caption.sav: 2029 bytes, produced by the game
        field: Life (or record hash if the field has no name)
        offset: 0x...
        sample: synthetic 40-byte header only, generated by the app
    validations:
      required: false

  - type: dropdown
    id: game-acceptance
    attributes:
      label: Did the game accept the exported save?
      description: >-
        The game clamps out-of-range values rather than rejecting the file, so
        "the game loaded it" is not proof that the value was honoured. Check the
        value in-game before choosing an option.
      options:
        - Loaded and the changed value was honoured in game
        - Loaded but the changed value was clamped or ignored
        - Loaded, value not checked
        - Rejected (the game did not list or load the slot)
        - Not tested — no game available
        - Not a save-related bug
    validations:
      required: true

  - type: textarea
    id: flutter-environment
    attributes:
      label: Flutter / Dart version and `flutter doctor -v`
      description: Required if the failure is a build or startup failure; useful otherwise. Paste `flutter --version` and, for build/startup failures, the full `flutter doctor -v`.
      render: shell
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Where the bug lives. Pick the closest match; maintainers will relabel if needed.
      options:
        - Save engine
        - Save format / codec
        - File I/O and export
        - UI / tab
        - Build / runner
        - Docs
    validations:
      required: true

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      description: These are not formalities; an issue missing them cannot be triaged safely.
      options:
        - label: I am working on a copy of the save, not the only copy.
          required: true
        - label: I have not attached game data (save, ROM, dump, or a full `.local-fixtures/` tree).
          required: true
        - label: I searched existing issues and this is not a duplicate.
          required: true
