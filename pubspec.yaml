name: bomb_flower
description: "Bomb Flower — an original-flavoured Ocarina of Time save editor and save creator for Longshot."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  equatable: ^2.1.0
  bitsdojo_window: ^0.1.6
  material_ui: ^1.1.0
  file_selector: ^1.1.0
  path: ^1.9.1
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/schema/
    - assets/world/
    - assets/catalogue/
    - assets/fields/
